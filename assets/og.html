<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Space+Grotesk:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.985 0.006 85);
        --ink: oklch(0.245 0.012 75);
        --muted: oklch(0.505 0.012 75);
        --hair: oklch(0.885 0.007 85);
        --accent: oklch(0.5 0.14 262);
        --tint: color-mix(in oklch, var(--accent) 9%, var(--bg));
        --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --body: "Geist", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--body);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }

      /* faint concentric field, echoing the favicon mark */
      .field {
        position: absolute;
        right: -180px;
        top: 50%;
        translate: 0 -50%;
        width: 760px;
        height: 760px;
        opacity: 0.5;
      }
      .field circle {
        fill: none;
        stroke: var(--accent);
      }
      .field .core {
        fill: var(--accent);
        stroke: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            105deg,
            color-mix(in oklch, var(--accent) 7%, transparent),
            transparent 45%
          ),
          radial-gradient(
            120% 90% at 100% 50%,
            color-mix(in oklch, var(--accent) 6%, transparent),
            transparent 60%
          );
      }

      .rule {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 6px;
        background: var(--accent);
      }

      header,
      main,
      footer {
        position: relative;
      }

      .brandrow {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 38px;
        height: 38px;
        flex: none;
      }
      .mark .ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      .mark .call {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      .mark .core {
        fill: var(--accent);
      }

      .brand {
        font-family: var(--display);
        font-size: 25px;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .brand .dot {
        color: var(--accent);
      }

      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 82px;
        line-height: 1.04;
        letter-spacing: -0.022em;
        margin: 0 0 26px;
        max-width: 15ch;
      }

      p.sub {
        font-size: 29px;
        line-height: 1.42;
        font-weight: 300;
        color: var(--muted);
        margin: 0;
        max-width: 30ch;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 22px;
        color: var(--muted);
        border-top: 1px solid var(--hair);
        padding-top: 24px;
      }
      footer .tag {
        font-family: var(--display);
        color: var(--ink);
      }
      footer .meta {
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="grain"></div>
      <div class="rule"></div>
      <svg class="field" viewBox="0 0 760 760" aria-hidden="true">
        <circle cx="380" cy="380" r="360" stroke-width="1.5" opacity="0.28" />
        <circle cx="380" cy="380" r="290" stroke-width="1.5" opacity="0.34" />
        <circle cx="380" cy="380" r="220" stroke-width="2" opacity="0.42" />
        <circle cx="380" cy="380" r="150" stroke-width="3" opacity="0.55" />
        <circle class="core" cx="380" cy="380" r="46" opacity="0.7" />
      </svg>

      <header class="brandrow">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path class="ring" d="M22.6 7.2A11 11 0 1 0 22.6 24.8" />
          <path class="call" d="M30 16H21.2" />
          <circle class="core" cx="16" cy="16" r="3.6" />
        </svg>
        <span class="brand">autonomykernel<span class="dot">.</span>org</span>
      </header>

      <main>
        <h1 id="title">The Autonomy Kernel Hypothesis</h1>
        <p class="sub" id="sub">
          An operating system for autonomous work: a worldview to weigh, and a
          boundary to build on.
        </p>
      </main>

      <footer>
        <span class="tag" id="tag">Vlad Palos · Contract v0.1</span>
        <span class="meta" id="meta">A proposed standard</span>
      </footer>
    </div>

    <script>
      const p = new URLSearchParams(location.search);
      const set = (id, v) => {
        if (v) document.getElementById(id).textContent = v;
      };
      set("title", p.get("title"));
      set("sub", p.get("sub"));
      set("tag", p.get("tag"));
      set("meta", p.get("meta"));
    </script>
  </body>
</html>
